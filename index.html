<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Performance Summary</title>

  <!-- Export Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; color: #333; padding: 15px; }
    .container { max-width: 1400px; margin: 0 auto; }
    
    h2 { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #2c3e50; text-transform: uppercase; }
    
    .filter-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 11px; font-weight: 600; margin-bottom: 4px; color: #555; }
    .form-group select, .form-group button { padding: 7px 9px; border-radius: 5px; border: 1px solid #ccc; font-size: 12px; }
    .btn-submit { background-color: #007bff; color: white; border: none !important; font-weight: bold; cursor: pointer; }
    .btn-submit:hover { background-color: #0056b3; }
    
    .action-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 15px; }
    .btn-export { padding: 7px 12px; border-radius: 5px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; color: white; }
    .btn-excel { background-color: #1d6f42; }
    .btn-jpg { background-color: #e67e22; }
    .btn-png { background-color: #8e44ad; }

    .table-container { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; padding: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
    
    thead th { background-color: #e91e63; color: white; padding: 8px 4px; font-weight: 600; border: 1px solid #c2185b; }
    tbody td { padding: 7px 4px; border: 1px solid #e0e0e0; }
    tbody tr:nth-child(even) { background-color: #f9f9f9; }
    tbody tr:hover { background-color: #f1f1f1; }
    
    .text-red { color: #d32f2f !important; font-weight: bold; }
    .badge-rules { background-color: #ffebee; color: #c62828; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    .badge-point { background-color: #2e7d32; color: white; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
    .badge-rank { background-color: #1565c0; color: white; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
    .loading-text { text-align: center; padding: 20px; font-style: italic; color: #666; }
  </style>
</head>
<body>

<div class="container">
  <h2>Performance Summary Dashboard</h2>

  <div class="filter-card">
    <div class="filter-grid">
      <div class="form-group">
        <label>Mode Periode</label>
        <select id="filterMode" onchange="updatePeriodOptions()">
          <option value="weekly">Weekly</option>
          <option value="biweekly" selected>Bi-Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tahun</label>
        <select id="filterYear"></select>
      </div>

      <div class="form-group">
        <label>Pilih Periode</label>
        <select id="filterValue"></select>
      </div>

      <div class="form-group">
        <label>Filter TL</label>
        <select id="filterTl">
          <option value="All">All TL</option>
        </select>
      </div>

      <div class="form-group">
        <label>Filter Skill</label>
        <select id="filterSkill">
          <option value="All">All Skill</option>
          <option value="Inbound">Inbound</option>
          <option value="Email">Email</option>
          <option value="Live Chat">Live Chat</option>
          <option value="Socmed">Socmed</option>
        </select>
      </div>

      <div class="form-group">
        <button class="btn-submit" onclick="loadKpiData()">Tampilkan</button>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn-export btn-excel" onclick="exportExcel()"> Export Excel</button>
    <button class="btn-export btn-jpg" onclick="exportImage('jpeg')"> Export JPG</button>
    <button class="btn-export btn-png" onclick="exportImage('png')"> Export PNG</button>
  </div>

  <div class="table-container" id="exportArea">
    <table id="kpiTable">
      <thead>
        <tr>
          <th rowspan="2">NAMA</th>
          <th rowspan="2">TEAM LEADER</th>
          <th rowspan="2">SKILL</th>
          <th colspan="3">PRODUCTIVITY 40%</th>
          <th colspan="3">QUALITY 50%</th>
          <th colspan="3">ATTENDANCE 10%</th>
          <th rowspan="2">ALL RESULT</th>
          <th rowspan="2">CX RULES</th>
          <th rowspan="2">FINAL RESULT</th>
          <th rowspan="2">POIN</th>
          <th rowspan="2">RANK</th>
        </tr>
        <tr>
          <th>ACH</th>
          <th>TGT</th>
          <th>RESULT</th>
          <th>ACH</th>
          <th>TGT</th>
          <th>RESULT</th>
          <th>ACH</th>
          <th>TGT</th>
          <th>RESULT</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="18" class="loading-text">Memuat opsi filter...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // ID Penerapan Web App Apps Script milikmu:
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwwxR2HzyAx3WqCR7ikzId3kFkUM5Mlj5t598MfJN-qlGcJP67dJpQiGRvUWTayPyOD1g/exec";

  let globalOptions = { years: [], months: [], weeks: [], biweeks: [], tls: [] };

  window.onload = function() {
    fetch(`${GAS_API_URL}?action=getFilters`)
      .then(res => res.json())
      .then(options => {
        globalOptions = options;
        
        const yearSelect = document.getElementById('filterYear');
        yearSelect.innerHTML = '';
        (options.years.length > 0 ? options.years : [2026]).forEach(y => {
          yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
        });

        const tlSelect = document.getElementById('filterTl');
        tlSelect.innerHTML = '<option value="All">All TL</option>';
        options.tls.forEach(tl => {
          tlSelect.innerHTML += `<option value="${tl}">${tl}</option>`;
        });

        updatePeriodOptions();
      })
      .catch(err => console.error("Error loading filters:", err));
  };

  function updatePeriodOptions() {
    const mode = document.getElementById('filterMode').value;
    const valueSelect = document.getElementById('filterValue');
    valueSelect.innerHTML = '';

    if (mode === 'weekly') {
      globalOptions.weeks.forEach(w => valueSelect.innerHTML += `<option value="${w}">${w}</option>`);
    } else if (mode === 'biweekly') {
      globalOptions.biweeks.forEach(bw => valueSelect.innerHTML += `<option value="${bw}">${bw}</option>`);
    } else if (mode === 'monthly') {
      const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      for (let m = 1; m <= 12; m++) {
        valueSelect.innerHTML += `<option value="${m}">Bulan ${m} (${monthNames[m-1]})</option>`;
      }
    } else if (mode === 'yearly') {
      valueSelect.innerHTML = `<option value="ALL">Full Year</option>`;
    }

    loadKpiData();
  }

  function loadKpiData() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="18" class="loading-text">Sedang mengambil data dari Google Sheets...</td></tr>';

    const mode = document.getElementById('filterMode').value;
    const year = document.getElementById('filterYear').value;
    const value = document.getElementById('filterValue').value;
    const tl = document.getElementById('filterTl').value;
    const skill = document.getElementById('filterSkill').value;

    const url = `${GAS_API_URL}?action=getData&mode=${mode}&year=${year}&value=${value}&tl=${encodeURIComponent(tl)}&skill=${encodeURIComponent(skill)}`;

    fetch(url)
      .then(res => res.json())
      .then(data => renderTable(data))
      .catch(err => {
        tbody.innerHTML = '<tr><td colspan="18" class="loading-text">Gagal mengambil data. Cek koneksi / URL API.</td></tr>';
      });
  }

  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="18" class="loading-text">Data tidak ditemukan.</td></tr>';
      return;
    }

    data.forEach(item => {
      const prodAchNum = (item.prodAch / item.prodTgt) * 100;
      const qaAchNum = parseFloat(item.qaAch);

      const prodClass = prodAchNum < 90 ? 'text-red' : '';
      const qaClass = qaAchNum < 90 ? 'text-red' : '';
      const rulesTxt = item.cxRules !== 'No Rules' ? `<span class="badge-rules">${item.cxRules} (${item.penaltyTxt})</span>` : 'No Rules';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align: left; font-weight: 600;">${item.nama}</td>
        <td>${item.team_leader}</td>
        <td>${item.section}</td>
        
        <td class="${prodClass}">${item.prodAch}</td>
        <td>${item.prodTgt}</td>
        <td>${item.prodResult}</td>
        
        <td class="${qaClass}">${item.qaAch}</td>
        <td>${item.qaTgt}</td>
        <td>${item.qaResult}</td>
        
        <td>${item.atdAch}</td>
        <td>${item.atdTgt}</td>
        <td>${item.atdResult}</td>
        
        <td style="font-weight: bold; color: #555;">${item.allResult}</td>
        <td>${rulesTxt}</td>
        <td style="font-weight: bold; background-color: #e8f5e9; color: #2e7d32;">${item.finalResult}</td>
        <td><span class="badge-point">${item.allPoint}</span></td>
        <td><span class="badge-rank">${item.rank}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function exportExcel() {
    const table = document.getElementById('kpiTable');
    const wb = XLSX.utils.table_to_book(table, { sheet: "KPI Summary" });
    const period = document.getElementById('filterValue').value;
    XLSX.writeFile(wb, `KPI_Summary_${period}.xlsx`);
  }

  function exportImage(type) {
    const area = document.getElementById('exportArea');
    const period = document.getElementById('filterValue').value;
    
    html2canvas(area, { scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = `KPI_Summary_${period}.${type}`;
      link.href = canvas.toDataURL(`image/${type}`);
      link.click();
    });
  }
</script>

</body>
</html>
